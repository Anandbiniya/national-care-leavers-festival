<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Five joined hands coming together">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
    <style>
      .outline { stroke:#2f3a2f; stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
      .detail { fill:none; stroke:#2f3a2f; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:0.75; }
    </style>
  </defs>

  <rect width="600" height="560" fill="#FFFCF8"/>

