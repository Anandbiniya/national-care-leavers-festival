  <path d="M176 258 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#FF8A45" opacity="0.9"/>
  <path d="M455 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#347A3D" opacity="0.9"/>

