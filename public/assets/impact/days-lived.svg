<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Young people sitting together sharing experiences">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="hand-drawn-stroke" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#FFFCF8" rx="24" />

  <circle cx="200" cy="320" r="130" fill="#FFEFE6" opacity="0.5" />

  <g filter="url(#soft-shadow)">
    <path d="M260 300 Q 240 340 260 380 Q 300 380 320 340 Q 300 300 260 300 Z" fill="#245F30" />
    <path d="M275 330 Q 265 360 275 390 Q 300 390 310 360 Q 290 330 275 330 Z" fill="#FFEFE6" stroke="#174422" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="285" cy="345" r="8" fill="#347A3D" />
    <circle cx="298" cy="340" r="4" fill="#FFFFFF" />
  </g>

  <g filter="url(#soft-shadow)">
