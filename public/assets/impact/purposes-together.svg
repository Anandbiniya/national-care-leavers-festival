<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Young people collaborating around a workshop table">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="hand-drawn-stroke" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#FFFCF8" rx="24" />

  <circle cx="220" cy="340" r="140" fill="#FFEFE6" opacity="0.45" />

  <g filter="url(#soft-shadow)">
    <path d="M260 280 Q 240 320 260 360 Q 300 360 320 320 Q 300 280 260 280 Z" fill="#245F30" />
    <path d="M275 310 Q 265 340 275 370 Q 300 370 310 340 Q 290 310 275 310 Z" fill="#FFF5EA" stroke="#174422" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="285" cy="325" r="8" fill="#347A3D" />
    <circle cx="298" cy="320" r="4" fill="#FFFFFF" />
  </g>

  <g filter="url(#soft-shadow)">
    <path d="M420 300 Q 400 340 420 380 Q 460 380 480 340 Q 460 300 420 300 Z" fill="#174422" />
    <path d="M435 330 Q 425 360 435 390 Q 460 390 470 360 Q 450 330 435 330 Z" fill="#FFF5EA" stroke="#174422" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="445" cy="345" r="8" fill="#FF8A45" />
    <circle cx="458" cy="340" r="4" fill="#FFFFFF" />
  </g>

  <g filter="url(#soft-shadow)">
    <path d="M340 240 Q 320 280 340 320 Q 380 320 400 280 Q 380 240 340 240 Z" fill="#8e7bad" />
    <path d="M355 270 Q 345 300 355 330 Q 380 330 390 300 Q 370 270 355 270 Z" fill="#FFFCF8" stroke="#174422" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="365" cy="285" r="8" fill="#347A3D" />
    <circle cx="378" cy="280" r="4" fill="#FFFFFF" />
  </g>

  <path d="M240 190 Q 210 210 240 230 Q 270 230 300 210 Q 270 190 240 190 Z" fill="#FF8A45" opacity="0.9" stroke="#A5481F" stroke-width="2.5" stroke-linecap="round" />
  <path d="M250 210 Q 240 230 250 250 Q 280 250 290 230 Q 260 210 250 210 Z" fill="#FFFCF8" stroke="#A5481F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
