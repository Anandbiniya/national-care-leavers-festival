  <path d="M420 200 Q 390 220 420 240 Q 450 240 480 220 Q 450 200 420 200 Z" fill="#347A3D" opacity="0.9" stroke="#174422" stroke-width="2.5" stroke-linecap="round" />
  <path d="M430 220 Q 420 240 430 260 Q 460 260 470 240 Q 450 220 430 220 Z" fill="#FFFCF8" stroke="#174422" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
